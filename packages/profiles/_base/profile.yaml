schema_version: "1.0"
id: _base
kind: base
name: 공통 베이스
description: 모든 프로파일이 상속하는 최소 공통 규칙. 생명주기와 산업에 무관한 부분만 담는다.
status: stable

standards:
  - id: "ISO/IEC/IEEE 29148:2018"
    name_ko: "시스템 및 소프트웨어 공학 - 생명주기 프로세스 - 요구공학"
    issuer: "ISO/IEC/IEEE"
    layer: international
    enforcement: L4
    scope: [requirements]
    role: linter_source
    lifecycle: any
    edition_year: 2018
    status: current
    confidence: high

  - id: "ISO/IEC/IEEE 29119-3:2021"
    name_ko: "소프트웨어 시험 - 제3부: 시험 문서화"
    issuer: "ISO/IEC/IEEE"
    layer: international
    enforcement: L4
    scope: [test]
    role: template_source
    lifecycle: any
    edition_year: 2021
    status: current
    confidence: high

  - id: "ISO/IEC/IEEE 29119-4:2021"
    name_ko: "소프트웨어 시험 - 제4부: 시험 기법"
    issuer: "ISO/IEC/IEEE"
    layer: international
    enforcement: L4
    scope: [test]
    role: generator_source
    lifecycle: any
    edition_year: 2021
    status: current
    confidence: high

  - id: "ISO/IEC/IEEE 42010:2022"
    name_ko: "소프트웨어, 시스템 및 기업 - 아키텍처 기술"
    issuer: "ISO/IEC/IEEE"
    layer: international
    enforcement: L4
    scope: [design]
    role: template_source
    lifecycle: any
    edition_year: 2022
    status: current
    confidence: high

  - id: "ISO/IEC 25010"
    name_ko: "시스템 및 소프트웨어 품질 모델"
    issuer: "ISO/IEC"
    layer: international
    enforcement: L4
    scope: [quality]
    role: taxonomy_source
    lifecycle: any
    status: current
    confidence: medium
    note: "판본별 품질특성 구성 확인 필요"

  - id: "ISO/IEC 5055:2021"
    name_ko: "자동 소스코드 품질 측정"
    issuer: "ISO/IEC"
    layer: international
    enforcement: L4
    scope: [quality, coding]
    role: metric_source
    lifecycle: any
    edition_year: 2021
    status: current
    confidence: high

id_scheme:
  requirement: "REQ-{n:03d}"
  testcase: "TC-{req_id}-{n:02d}"
  component: "CMP-{n:03d}"

artifacts:
  - id: BASE-REQ
    ref: requirements-spec
    name: 요구사항 명세서
    required: true
    derivable: B
    prompt: prompts/extract-requirements.md
    standard_refs: ["ISO/IEC/IEEE 29148:2018"]

  - id: BASE-ARC
    ref: architecture-desc
    name: 아키텍처 기술서
    required: true
    derivable: A
    prompt: prompts/compose-architecture.md
    standard_refs: ["ISO/IEC/IEEE 42010:2022"]

  - id: BASE-RTM
    ref: rtm
    name: 요구사항 추적표
    required: true
    derivable: A
    standard_refs: ["ISO/IEC/IEEE 29148:2018"]

traceability_rules:
  - from: requirement
    to: component
    relation: implements
    required: true
  - from: requirement
    to: testcase
    relation: verifies
    required: true

quality_gates:
  - name: evidence_anchor_rate
    metric: anchor_rate
    threshold: 0.85
    op: gte
    blocking: true
  - name: rtm_coverage
    metric: req_with_tc_ratio
    threshold: 1.0
    op: gte
    blocking: true
  - name: lint_pass
    metric: lint_pass_ratio
    threshold: 0.90
    op: gte
    blocking: true

lint_includes:
  - rules/lint-iso29148.yaml

derivable_policy:
  A: auto_generate
  B: auto_generate_with_review
  C: skeleton_only

evidence_policy:
  require_anchor: true
  unanchored_tag: "[추정]"
  unanchored_action: force_review

output_formats: [docx, xlsx, md, pdf]
output_default: docx

context_schema:
  system_type:
    type: enum
    values: [embedded, control, enterprise, web, mobile, data-analytics, ml-ai, infra]
    desc: 시스템 유형
  procurement:
    type: list
    values: [공공조달, 민간B2B, B2C, 수출, 내부]
    desc: 조달 경로
  uses_oss:
    type: bool
    default: false
    desc: 오픈소스 사용 여부
  ai_applied:
    type: bool
    default: false
    desc: ML/AI 모델 포함 여부
