schema_version: "1.0"
id: lint-iso29148
name: ISO/IEC/IEEE 29148 요구사항 품질 린터 룰셋
standard_ref: "ISO/IEC/IEEE 29148:2018"
description: >
  29148의 개별 요구사항 품질특성(필요성, 구현중립성, 명확성, 단일성, 완전성,
  일관성, 실현가능성, 추적가능성, 검증가능성)을 기계 검사 가능한 규칙으로 옮긴 것.
  원문 조항 텍스트는 포함하지 않으며 조항 번호 참조와 자체 작성 규칙만 사용한다.

rules:
  # --- 명확성 (unambiguous) ---
  - id: RQ-AMB-01
    desc: "모호 형용사·부사 사용 금지"
    severity: error
    applies_to: [requirement]
    pattern: "(적절히|적절한|신속하게|신속한|충분히|충분한|효율적으로|효율적인|빠르게|쉽게|사용자 친화적|직관적으로|최적의|가능한 한)"
    quality_attribute: unambiguous

  - id: RQ-AMB-02
    desc: "열거 생략어 사용 금지 — 요구사항은 완결된 목록을 가져야 한다"
    severity: error
    applies_to: [requirement]
    pattern: "(등등|기타 등|등을|등의|등이|및 기타|그 외)"
    quality_attribute: complete

  - id: RQ-AMB-03
    desc: "대명사 지시 금지 — 주체를 명시해야 한다"
    severity: warning
    applies_to: [requirement]
    pattern: "(이것|그것|해당 기능은|위의|아래의|앞서 언급한)"
    quality_attribute: unambiguous

  # --- 단일성 (singular) ---
  - id: RQ-SNG-01
    desc: "한 문장에 둘 이상의 요구가 결합되어 있다"
    severity: error
    applies_to: [requirement]
    pattern: "(\\s및\\s.*(해야 한다|하여야 한다)|\\s그리고\\s.*(해야 한다|하여야 한다))"
    quality_attribute: singular

  - id: RQ-SNG-02
    desc: "선택적 표현(또는/혹은)은 요구를 분리해야 한다"
    severity: warning
    applies_to: [requirement]
    pattern: "(또는|혹은|및/또는)"
    quality_attribute: singular

  # --- 검증가능성 (verifiable) ---
  - id: RQ-VER-01
    desc: "정량 기준 없는 성능·품질 요구"
    severity: error
    applies_to: [requirement]
    pattern: "(빠른|느린|안정적인|견고한|확장 가능한|유연한|고성능)"
    quality_attribute: verifiable
    exempt_if_has: ["\\d+\\s*(ms|초|분|시간|건|회|%|MB|GB|TPS|QPS)"]

  - id: RQ-VER-02
    desc: "검증 방법을 특정할 수 없는 서술형 요구"
    severity: warning
    applies_to: [requirement]
    pattern: "(고려한다|고려하여|지향한다|노력한다|권장한다|바람직하다)"
    quality_attribute: verifiable

  # --- 구현중립성 (implementation-free) ---
  - id: RQ-IMP-01
    desc: "요구사항에 구현 기술·제품명이 명시되어 있다"
    severity: warning
    applies_to: [requirement]
    pattern: "(React|Django|Spring|MySQL|PostgreSQL|Redis|Kafka|Docker|Kubernetes|AWS|Azure)"
    quality_attribute: implementation_free
    note: "인터페이스 제약으로 기술이 지정된 경우 예외 처리 가능"

  # --- 필요성·의무성 (necessary / mandatory) ---
  - id: RQ-NEC-01
    desc: "의무 조동사가 없다 — 요구사항은 '~해야 한다' 형태여야 한다"
    severity: error
    applies_to: [requirement]
    pattern_absent: "(해야 한다|하여야 한다|한다\\.|shall|must)"
    quality_attribute: mandatory

  - id: RQ-NEC-02
    desc: "권고 표현은 요구사항이 아니다"
    severity: warning
    applies_to: [requirement]
    pattern: "(할 수 있다|하면 좋다|권장된다|should|may)"
    quality_attribute: mandatory

  # --- 추적가능성 (traceable) ---
  - id: RQ-TRC-01
    desc: "요구사항 ID가 프로파일의 id_scheme과 일치하지 않는다"
    severity: error
    applies_to: [requirement]
    check: id_scheme_match
    quality_attribute: traceable

  - id: RQ-TRC-02
    desc: "요구사항 ID가 중복된다"
    severity: error
    applies_to: [requirement]
    check: id_unique
    quality_attribute: traceable

  - id: RQ-TRC-03
    desc: "코드 증거 앵커가 없다"
    severity: error
    applies_to: [requirement]
    check: has_evidence_anchor
    quality_attribute: traceable

  # --- 완전성 (complete) ---
  - id: RQ-CMP-01
    desc: "TBD/TBC/미정 표기가 남아 있다"
    severity: error
    applies_to: [requirement, testcase]
    pattern: "(TBD|TBC|미정|추후 확정|논의 필요)"
    quality_attribute: complete

  - id: RQ-CMP-02
    desc: "조건절만 있고 결과 동작이 없다"
    severity: warning
    applies_to: [requirement]
    check: has_action_clause
    quality_attribute: complete

  # --- 테스트케이스 ---
  - id: TC-EXP-01
    desc: "기대결과가 관찰 가능한 형태가 아니다"
    severity: error
    applies_to: [testcase]
    pattern: "(정상 동작|잘 동작|올바르게 처리|문제 없이)"

  - id: TC-EXP-02
    desc: "사전조건이 비어 있다"
    severity: warning
    applies_to: [testcase]
    check: has_precondition

  - id: TC-LNK-01
    desc: "연결된 요구사항 ID가 없다"
    severity: error
    applies_to: [testcase]
    check: has_requirement_link
