schema_version: "1.0"
id: X1-ai-system
kind: overlay
name: AI 시스템 오버레이
description: ML/LLM이 의사결정에 개입하는 시스템에 중첩 적용되는 거버넌스·산출물 레이어
status: beta

activation:
  any_of:
    - { signal: dependency, match: "torch|tensorflow|transformers|onnxruntime|scikit-learn|xgboost", weight: 0.40 }
    - { signal: file_glob,  match: "**/*.onnx|**/*.safetensors|**/*.gguf|**/*.pt|**/*.pkl", weight: 0.40 }
    - { signal: keyword,    match: "model\\.predict|\\.inference\\(|prompt_template|openai\\.|anthropic\\.", weight: 0.30 }
    - { signal: context,    match: "ai_applied == true", weight: 1.00 }
  manual_override: allowed

standards_add:
  - id: "ISO/IEC 42001:2023"
    name_ko: "인공지능 경영시스템"
    issuer: "ISO/IEC"
    layer: international
    enforcement: L4
    scope: [process, governance]
    lifecycle: any
    edition_year: 2023
    status: current
    confidence: high

  - id: "ISO/IEC 23894:2023"
    name_ko: "인공지능 - 위험관리 지침"
    issuer: "ISO/IEC"
    layer: international
    enforcement: L4
    scope: [risk]
    lifecycle: any
    edition_year: 2023
    status: current
    confidence: high

  - id: "ISO/IEC 42005"
    name_ko: "AI 시스템 영향평가"
    issuer: "ISO/IEC"
    layer: international
    enforcement: L4
    scope: [risk, governance]
    lifecycle: any
    status: current
    confidence: low
    note: "발행 시점·적용 범위 확인 필요"

  - id: "인공지능 기본법"
    name_ko: "인공지능 발전과 신뢰 기반 조성 등에 관한 기본법"
    issuer: "과학기술정보통신부"
    layer: law
    enforcement: L1
    legal_basis:
      ministry: "과학기술정보통신부"
      effective: "2026-01-22"
    scope: [governance]
    lifecycle: any
    status: current
    confidence: medium
    note: "하위법규 세부 의무 확인 필요"

  - id: "NIST AI RMF 1.0"
    name_ko: "NIST 인공지능 위험관리 프레임워크"
    issuer: "NIST"
    layer: de_facto
    enforcement: L4
    scope: [risk, governance]
    lifecycle: any
    edition_year: 2023
    status: current
    confidence: high

artifacts_add:
  - id: AI-01
    name: AI 시스템 개요서
    phase: AI거버넌스
    required: true
    derivable: B
    standard_refs: ["ISO/IEC 42001:2023"]
  - id: AI-02
    name: 모델 카드
    phase: AI거버넌스
    required: true
    derivable: B
    standard_refs: ["ISO/IEC 42001:2023"]
  - id: AI-03
    name: 데이터 카드
    phase: AI거버넌스
    required: true
    derivable: B
    standard_refs: ["ISO/IEC 42001:2023"]
  - id: AI-04
    name: AI 위험 등록부
    phase: AI거버넌스
    required: true
    derivable: C
    standard_refs: ["ISO/IEC 23894:2023"]
  - id: AI-05
    name: 인간 감독 절차서
    phase: AI거버넌스
    required: true
    derivable: C
    standard_refs: ["ISO/IEC 42001:2023"]
  - id: AI-06
    name: AI 영향평가서
    phase: AI거버넌스
    required: false
    derivable: C
    conditional: true
    standard_refs: ["ISO/IEC 42005"]

traceability_rules_add:
  - from: software_req
    to: model_artifact
    relation: realized_by
    required: true
  - from: dataset
    to: model_artifact
    relation: trains
    required: true

quality_gates_add:
  - name: model_provenance
    metric: model_artifacts_with_card
    threshold: 1.0
    op: gte
    blocking: true

lint_rules_add:
  - id: AI-LINT-01
    desc: "AI 출력이 최종 의사결정에 직결되는 요구사항은 인간 감독 절차를 명시해야 한다"
    severity: error
    applies_to: [requirement]
    standard_ref: "ISO/IEC 42001:2023"
  - id: AI-LINT-02
    desc: "모델 산출물에 학습 데이터 출처가 기재되지 않았다"
    severity: error
    applies_to: [model_artifact]
  - id: AI-LINT-03
    desc: "비결정적 출력을 가진 요구사항에 검증 전략이 없다"
    severity: warning
    applies_to: [requirement]

conflict_rules:
  - "인공지능기본법령과 산업별 AI 가이드라인이 중복 적용되면 기본법령을 우선 적용한다"
  - "AI 산출물은 산업 도메인의 산출물 체계에 통합하되, 모델 카드·데이터 카드는 독립 문서로 유지한다"
