schema_version: "1.0"
id: X4-cloud-saas
kind: overlay
name: 클라우드·SaaS 오버레이
description: 클라우드 배포 또는 SaaS 이용이 있는 시스템에 중첩 적용
status: beta

activation:
  any_of:
    - { signal: file_glob,  match: "**/Dockerfile|**/docker-compose*.yml|**/*.tf|**/k8s/**|**/helm/**", weight: 0.40 }
    - { signal: dependency, match: "boto3|google-cloud|azure-|kubernetes", weight: 0.35 }
    - { signal: context,    match: "cloud_deployment == true", weight: 1.00 }
  manual_override: allowed

standards_add:
  - id: "ISO/IEC 27017:2015"
    name_ko: "클라우드 서비스 정보보안 실무 지침"
    issuer: "ISO/IEC"
    layer: international
    enforcement: L4
    scope: [security, infra]
    audit_body: null
    lifecycle: any
    edition_year: 2015
    status: current
    confidence: high

  - id: "ISO/IEC 27018:2019"
    name_ko: "퍼블릭 클라우드 개인정보 보호 실무 지침"
    issuer: "ISO/IEC"
    layer: international
    enforcement: L4
    scope: [data, security]
    audit_body: null
    lifecycle: any
    edition_year: 2019
    status: current
    confidence: high

artifacts_add:
  - id: CS-01
    name: 클라우드 아키텍처 구성도
    phase: 인프라
    required: true
    derivable: A
  - id: CS-02
    name: 클라우드 보안 통제 명세
    phase: 인프라
    required: true
    derivable: B
    standard_refs: ["ISO/IEC 27017:2015"]
  - id: CS-03
    name: 데이터 소재지 및 이전 내역서
    phase: 인프라
    required: false
    derivable: C
    conditional: true
    standard_refs: ["ISO/IEC 27018:2019"]

quality_gates_add:
  - name: iac_drift
    metric: iac_untracked_resource_count
    threshold: 0
    op: lte
    blocking: false

lint_rules_add:
  - id: CS-LINT-01
    desc: "인프라 요구사항에 가용성·복구 목표(RTO/RPO)가 정량화되지 않았다"
    severity: warning
    applies_to: [requirement]

conflict_rules:
  - "국내 공공·금융은 CSAP 등 국내 인증이 우선하고 본 오버레이는 보완 적용한다"
