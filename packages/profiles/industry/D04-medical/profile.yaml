schema_version: "1.0"
id: D04-medical
kind: industry
extends: _base
name: 의료·헬스케어·의료기기
description: >
  디지털의료제품법 체계와 IEC 62304 생명주기를 결합한 의료기기 소프트웨어 프로파일.
  국내 허가는 디지털의료제품법이 우선하고, IEC 62304는 그 산출물을 구성하는
  방법론으로 작동한다. 국내 등급(1~4등급)과 62304 안전성 등급(A/B/C)은 독립 판정된다.
tier: T1
status: beta

ksic: ["C27", "Q86", "J62"]
ncs_ref: ["임베디드SW엔지니어링", "응용SW엔지니어링"]
audit_bodies:
  - 식품의약품안전처
  - 식품의약품안전평가원
  - 의료기기 인증기관

lifecycle_default: v-model
lifecycle_options: [v-model, hybrid]

risk_scheme:
  name: "IEC62304_Class"
  levels: ["A", "B", "C"]
  secondary: ["1등급", "2등급", "3등급", "4등급"]

id_scheme:
  software_req: "SRS-{n:03d}"
  requirement: "SRS-{n:03d}"
  unit_test: "UT-{req_id}-{n:02d}"
  risk_item: "RSK-{n:03d}"
  soup_item: "SOUP-{n:02d}"

output_formats: [docx, xlsx, pdf]
output_default: docx

default_overlays: [X2, X5]

