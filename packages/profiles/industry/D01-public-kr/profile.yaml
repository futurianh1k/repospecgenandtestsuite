    phase: 구현
    required: true
    derivable: A
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]
  - id: IM-02
    name: 단위시험 결과서
    phase: 구현
    required: true
    derivable: C
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]
  - id: IM-03
    name: 데이터베이스 테이블
    phase: 구현
    required: true
    derivable: A
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]

  # ── 시험 단계 (TE) ──
  - id: TE-01
    name: 통합시험 결과서
    phase: 시험
    required: true
    derivable: C
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]
  - id: TE-02
    name: 시스템시험 결과서
    phase: 시험
    required: true
    derivable: C
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]
  - id: TE-03
    name: 사용자 지침서
    phase: 시험
    required: true
    derivable: C
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]
  - id: TE-04
    name: 운영자 지침서
    phase: 시험
    required: true
    derivable: C
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]
  - id: TE-05
    name: 시스템 설치 결과서
    phase: 시험
    required: true
    derivable: C
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]
  - id: TE-06
    name: 인수시험 시나리오
    phase: 시험
    required: true
    derivable: B
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]
  - id: TE-07
    name: 인수시험 결과서
    phase: 시험
    required: true
    derivable: C
    standard_refs: ["CBD SW개발 표준 산출물 관리 가이드"]

  # ── 감리·계약 대응 (AU) — 조건부 ──
  - id: AU-01
    name: 과업대비표
    phase: 감리
    required: false
    derivable: B
    conditional: true
    prompt: prompts/build-scope-matrix.md
    template: templates/au-01-scope-matrix.xlsx.j2
    standard_refs: ["소프트웨어 진흥법", "행정안전부고시 제2021-4호"]
  - id: AU-02
    name: 감리 수감 자료 목록
    phase: 감리
    required: false
    derivable: A
    conditional: true
    standard_refs: ["행정안전부고시 제2021-4호"]
  - id: AU-03
    name: 감리 지적사항 조치 내역서
    phase: 감리
    required: false
    derivable: C
    conditional: true
    standard_refs: ["행정안전부고시 제2021-4호"]
  - id: AU-04
    name: 과업변경 요청·승인 내역서
    phase: 감리
    required: false
    derivable: C
    conditional: true
    standard_refs: ["소프트웨어 진흥법"]

  # ── 보안 (SC) — 조건부 ──
  - id: SC-KR-01
    name: 시큐어코딩 점검표
    phase: 보안
    required: false
    derivable: A
    conditional: true
    standard_refs: ["소프트웨어 개발보안 가이드 (KISA)"]
  - id: SC-KR-02
    name: 보안약점 진단 결과서
    phase: 보안
    required: false
    derivable: C
    conditional: true
    standard_refs: ["소프트웨어 개발보안 가이드 (KISA)"]
  - id: SC-KR-03
    name: 보안약점 조치 내역서
    phase: 보안
    required: false
    derivable: C
    conditional: true
    standard_refs: ["소프트웨어 개발보안 가이드 (KISA)"]

  # ── 개인정보 (PI) — 조건부 ──
  - id: PI-01
    name: 개인정보 영향평가서
    phase: 개인정보
    required: false
    derivable: C
    conditional: true
    standard_refs: ["개인정보 영향평가 고시"]

  # ── 데이터 (DB) — 조건부 ──
  - id: DB-KR-01
    name: 데이터베이스 표준 준수 점검표
    phase: 데이터
    required: false
    derivable: A
    conditional: true
    standard_refs: ["공공기관의 데이터베이스 표준화 지침"]
  - id: DB-KR-02
    name: 공공데이터 개방 목록 및 메타데이터 등록 결과서
    phase: 데이터
    required: false
    derivable: B
    conditional: true
    standard_refs: ["공공데이터법"]

  # ── 프레임워크·대가 (FW/FP) — 조건부 ──
  - id: FW-01
    name: 전자정부 표준프레임워크 준수 확인서
    phase: 설계
    required: false
    derivable: A
    conditional: true
    standard_refs: ["전자정부 표준프레임워크"]
  - id: FP-01
    name: 기능점수 산정서
    phase: 대가산정
    required: false
    derivable: A
    conditional: true
    prompt: prompts/estimate-function-points.md
    standard_refs: ["SW사업 대가산정 가이드", "ISO/IEC 20926"]

  # ── 클라우드 (CL) — 조건부 ──
  - id: CL-01
    name: 클라우드 보안인증 확인 내역
    phase: 인프라
    required: false
    derivable: C
    conditional: true
    standard_refs: ["CSAP"]

  # ── EA ──
  - id: EA-01
    name: EA 산출물 등록 내역
    phase: 시험
    required: false
    derivable: C
    conditional: true
    standard_refs: ["범정부 EA 메타모델"]

# ---------------------------------------------------------------------------
# 추적 규칙 — 두 축
# ---------------------------------------------------------------------------
traceability_rules_add:
  # 축 1: 내부 추적 (요구사항추적표, AN-03)
  - from: requirement
    to: component
    relation: implements
    required: true
    bidirectional: true
  - from: requirement
    to: unit_test
    relation: verifies
    required: true
  - from: requirement
    to: acceptance_test
    relation: verifies
    required: true

  # 축 2: 계약 이행 추적 (과업대비표, AU-01)
  # RFP 요구사항이 어느 산출물로 이행됐는지 증명한다.
  # 내부 추적과 섞으면 감리에서 과업 누락 소명이 불가능해진다.
  - from: rfp_requirement
    to: requirement
    relation: derives_from
    required: true
    bidirectional: true
  - from: rfp_requirement
    to: deliverable
    relation: documents
    required: true
  - from: change_request
    to: rfp_requirement
    relation: documents
    required: false

# ---------------------------------------------------------------------------
# 품질 게이트
# ---------------------------------------------------------------------------
quality_gates_add:
  - name: rtm_coverage
    metric: req_with_tc_ratio
    threshold: 1.0
    op: gte
    blocking: true
  - name: phase_deliverable_completeness
    metric: required_artifacts_present_ratio
    threshold: 1.0
    op: gte
    blocking: true

# ---------------------------------------------------------------------------
# 린터 규칙
# ---------------------------------------------------------------------------
lint_rules_add:
  - id: PB-LINT-01
    desc: "요구사항 ID의 분류 접두어가 선언된 분류 체계에 없다"
    severity: error
    applies_to: [requirement]
    standard_ref: "행정안전부고시 제2023-27호"
  - id: PB-LINT-02
    desc: "요구사항에 산출물 연결이 없어 과업대비표를 채울 수 없다"
    severity: error
    applies_to: [requirement]
  - id: PB-LINT-03
    desc: "요구사항 정의서 항목이 RFP 요구사항과 대응되지 않는다"
    severity: warning
    applies_to: [requirement]

# ---------------------------------------------------------------------------
# 컨텍스트 변수
# ---------------------------------------------------------------------------
context_schema:
  project_scale:
    type: enum
    values: ["소규모", "중규모", "대규모"]
    ordered: true
    required: true
    desc: 사업 규모. 산출물 필수 범위를 좌우한다
  project_type:
    type: enum
    values: [구축, 고도화, 유지관리, 운영]
    default: 구축
    desc: 사업 유형. 유지관리는 요구사항 분류 체계가 다르다
  req_code_scheme:
    type: enum
    values: [SFR_SIR, FUN_INR]
    default: SFR_SIR
    desc: >
      요구사항 분류 접두어 체계. 발주기관마다 다르다.
      SFR_SIR은 SFR/PER/DAR/SIR/TER/SER/QUR/COR/PMR/PSR,
      FUN_INR은 FUN/PER/DAR/INR/TER/SER/QUR/ECR/PMR/PSR를 쓴다.
  audit_required:
    type: bool
    default: false
    desc: 감리 의무 대상 여부
  pmo_delegated:
    type: bool
    default: false
    desc: 전자정부사업관리(PMO) 위탁 여부
  security_diagnosis:
    type: bool
    default: false
    desc: 보안약점 진단 대상 여부
  personal_data:
    type: bool
    default: false
    desc: 개인정보 처리 여부
  pia_required:
    type: bool
    default: false
    desc: 개인정보 영향평가 의무 대상 여부
  db_included:
    type: bool
    default: true
    desc: 데이터베이스 구축·변경 포함 여부
  public_data:
    type: bool
    default: false
    desc: 공공데이터 개방 대상 여부
  egov_framework:
    type: bool
    default: false
    desc: 전자정부 표준프레임워크 적용 여부
  fp_estimation:
    type: bool
    default: false
    desc: 기능점수 대가산정 필요 여부
  cloud_deployment:
    type: bool
    default: false
    desc: 클라우드 배포 여부
  data_migration:
    type: bool
    default: false
    desc: 데이터 전환 포함 여부

# ---------------------------------------------------------------------------
# 선택 규칙
# ---------------------------------------------------------------------------
selection_rules:
  - id: SR-AUDIT
    desc: "감리 대상 사업은 감리 대응 산출물이 필요하다"
    standard_ref: "행정안전부고시 제2021-4호"
    if:
      audit_required: true
    then:
      add_standards: ["행정안전부고시 제2021-4호"]
      add_artifacts: [AU-01, AU-02, AU-03, AU-04]
      add_trace_rules:
        - from: rfp_requirement
          to: deliverable
          relation: documents
          required: true
      add_gates:
        - name: scope_matrix_coverage
          metric: rfp_req_with_deliverable_ratio
          threshold: 1.0
          op: gte
          blocking: true
      notes:
        - "요구사항 변경이 있으면 발주자 확인 근거(회의록, 과업변경요청서 승인결과)를 함께 준비해야 한다"

  - id: SR-AUDIT-WAIVER
    desc: "PMO 위탁 소규모 사업은 감리 생략 가능성이 있다"
    standard_ref: "전자정부법 시행령"
    if:
      audit_required: false
      pmo_delegated: true
      project_scale: { lte_level: "소규모" }
    then:
      notes:
        - "감리 생략 가능 조건에 해당할 수 있으나, 생략 여부는 발주기관이 판단한다. 시행령 현행 기준 확인 필요"

  - id: SR-SCALE-LARGE
    desc: "대규모 사업은 데이터 전환 설계와 EA 등록이 필수다"
    standard_ref: "범정부 EA 메타모델"
    if:
      project_scale: { gte_level: "대규모" }
    then:
      add_artifacts: [EA-01]
      add_gates:
        - name: evidence_anchor_rate
          metric: anchor_rate
          threshold: 0.90
          op: gte
          blocking: true

  - id: SR-SCALE-SMALL
    desc: "소규모 사업은 일부 설계 산출물을 간소화할 수 있다"
    standard_ref: "CBD SW개발 표준 산출물 관리 가이드"
    if:
      project_scale: "소규모"
      audit_required: false
    then:
      relax_artifacts: [DE-02, DE-10]
      notes:
        - "간소화는 발주기관과 협의해 확정해야 하며, 요구사항추적표(AN-03)는 간소화 대상이 아니다"

  - id: SR-SECURITY-DIAG
    desc: "보안약점 진단 대상은 시큐어코딩 점검 체계가 필요하다"
    standard_ref: "소프트웨어 개발보안 가이드 (KISA)"
    if:
      security_diagnosis: true
    then:
      add_standards: ["소프트웨어 개발보안 가이드 (KISA)"]
      add_artifacts: [SC-KR-01, SC-KR-02, SC-KR-03]
      add_trace_rules:
        - from: weakness_item
          to: code_symbol
          relation: documents
          required: true
      add_gates:
        - name: weakness_critical
          metric: critical_weakness_count
          threshold: 0
          op: lte
          blocking: true
      require_overlays: [X2]

  - id: SR-PERSONAL-DATA
    desc: "개인정보 처리 시 보호 체계가 발동된다"
    standard_ref: "개인정보 보호법"
    if:
      personal_data: true
    then:
      add_standards: ["개인정보 보호법"]
      require_overlays: [X2]

  - id: SR-PIA
    desc: "개인정보 영향평가 의무 대상은 평가서가 필요하다"
    standard_ref: "개인정보 영향평가 고시"
    if:
      pia_required: true
    then:
      add_standards: ["개인정보 영향평가 고시"]
      add_artifacts: [PI-01]
      require_overlays: [X2]
      notes:
        - "영향평가는 지정 평가기관이 수행한다. 본 도구는 평가 입력자료만 준비한다"

  - id: SR-DB-STANDARD
    desc: "데이터베이스 포함 사업은 표준화 지침이 적용된다"
    standard_ref: "공공기관의 데이터베이스 표준화 지침"
    if:
      db_included: true
    then:
      add_standards: ["공공기관의 데이터베이스 표준화 지침"]
      add_artifacts: [DB-KR-01]

  - id: SR-PUBLIC-DATA
    desc: "공공데이터 개방 대상은 메타데이터 등록이 필요하다"
    standard_ref: "공공데이터법"
    if:
      public_data: true
    then:
      add_standards: ["공공데이터법"]
      add_artifacts: [DB-KR-02]

  - id: SR-EGOV-FW
    desc: "표준프레임워크 적용 사업은 준수 확인서가 필요하다"
    standard_ref: "전자정부 표준프레임워크"
    if:
      egov_framework: true
    then:
      add_standards: ["전자정부 표준프레임워크"]
      add_artifacts: [FW-01]

  - id: SR-FP
    desc: "기능점수 대가산정은 산정서와 추적축이 필요하다"
    standard_ref: "SW사업 대가산정 가이드"
    if:
      fp_estimation: true
    then:
      add_standards: ["SW사업 대가산정 가이드", "ISO/IEC 20926"]
      add_artifacts: [FP-01]
      add_trace_rules:
        - from: function_point
          to: requirement
          relation: derives_from
          required: true

  - id: SR-CLOUD
    desc: "클라우드 배포는 보안인증 확인이 필요하다"
    standard_ref: "CSAP"
    if:
      cloud_deployment: true
    then:
      add_standards: ["CSAP"]
      add_artifacts: [CL-01]
      require_overlays: [X4]

  - id: SR-MIGRATION
    desc: "데이터 전환이 있으면 전환 설계서가 필요하다"
    standard_ref: "CBD SW개발 표준 산출물 관리 가이드"
    if:
      data_migration: true
    then:
      add_artifacts: [DE-12]

  - id: SR-MAINTENANCE
    desc: "유지관리 사업은 구축 산출물 대신 유지관리 요구사항 체계를 쓴다"
    standard_ref: "행정안전부고시 제2023-27호"
    if:
      project_type: 유지관리
    then:
      drop_artifacts: [DE-08, DE-09, DE-12, IM-03, TE-05]
      notes:
        - "유지관리 사업은 요구사항 분류에 MAR(유지관리수행)·MHR(유지관리인력)이 추가된다"
        - "기존 시스템 산출물이 있으면 갱신 대상만 생성하도록 범위를 좁혀야 한다"

minimum_set:
  - "전자정부법"
  - "행정안전부고시 제2023-27호"
  - "CBD SW개발 표준 산출물 관리 가이드"
  - "소프트웨어 진흥법"
  - "ISO/IEC/IEEE 29148:2018"

conflict_rules:
  - "행안부 고시와 CBD 가이드가 상충하면 고시가 우선한다. CBD 가이드는 양식 참조 자료다"
  - "산출물 양식과 항목은 프로젝트 특성에 맞게 수정·추가할 수 있으나, 요구사항추적표와 과업대비표는 감리 필수 제출물이므로 생략하지 않는다"
  - "요구사항추적표(AN-03)와 과업대비표(AU-01)는 목적이 다르다. AN-03은 요구사항→설계→시험의 내부 추적이고, AU-01은 RFP 요구사항→산출물의 계약 이행 증명이다. 하나로 합치지 않는다"
  - "발주기관이 자체 방법론을 보유한 경우 그 방법론이 우선하며, 본 프로파일은 포크하여 조직 레이어로 사용한다"
