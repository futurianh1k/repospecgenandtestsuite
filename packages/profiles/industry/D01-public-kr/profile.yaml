schema_version: "1.0"
id: D01-public-kr
kind: industry
extends: _base
name: 공공행정·전자정부 (CBD 표준산출물)
description: >
  NIA CBD SW개발 표준 산출물 25종 기반 공공 정보화사업 프로파일.
  감리 대응과 과업대비표가 핵심이며, 요구사항 추적표는 RTM과 과업대비표의
  두 축으로 나뉜다. RTM은 요구사항→설계→시험의 내부 추적이고,
  과업대비표는 RFP 요구사항→산출물의 계약 이행 증명이다. 둘을 섞으면
  감리에서 과업 누락 소명이 불가능해진다.
tier: T2
status: beta

ksic: ["O84", "J62"]
ncs_ref: ["응용SW엔지니어링", "시스템SW엔지니어링", "DB엔지니어링"]
audit_bodies:
  - 정보시스템 감리법인
  - 발주기관 검수
  - 과업심의위원회

lifecycle_default: v-model
lifecycle_options: [v-model, hybrid]

risk_scheme:
  name: "사업규모"
  levels: ["소규모", "중규모", "대규모"]

id_scheme:
  requirement: "{req_type}-{n:03d}"
  rfp_requirement: "{req_type}-{n:03d}"
  unit_test: "UT-{req_id}-{n:02d}"
  component: "CMP-{n:03d}"
  deliverable: "{phase_code}-{n:02d}"

output_formats: [hwpx, docx, xlsx, pdf]
output_default: hwpx

default_overlays: [X2, X3]

